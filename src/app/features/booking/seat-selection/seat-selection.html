<div class="w-full max-w-4xl mx-auto space-y-4">
  <!-- Header Counter & Legend -->
  <div
    class="flex flex-wrap items-center justify-between text-xs font-semibold text-gray-600 px-1 gap-2"
  >
    <div class="flex items-center gap-4 text-[11px]">
      <span class="flex items-center gap-1.5">
        <span class="w-3 h-3 rounded-xs border border-gray-300 bg-white inline-block"></span>
        Available
      </span>
      <span class="flex items-center gap-1.5">
        <span class="w-3 h-3 rounded-xs border border-sky-600 bg-sky-50 inline-block"></span>
        Selected
      </span>
      <span class="flex items-center gap-1.5">
        <span
          class="w-3 h-3 rounded-xs border border-gray-200 bg-gray-100 opacity-60 inline-block"
        ></span>
        Booked
      </span>
    </div>

    <span
      [class.text-amber-600]="selectedSeatIds().length < maxSeats()"
      [class.text-emerald-600]="selectedSeatIds().length === maxSeats()"
    >
      {{ selectedSeatIds().length }}/{{ maxSeats() }} selected
    </span>
  </div>

  <!-- Cabin Layout Grid -->
  <div class="space-y-2">
    @for (row of seatRows(); track $index) {
      <div class="grid grid-cols-7 gap-2 sm:gap-3 items-center">
        <!-- Left Side Seats (3 Seats) -->
        @for (seat of row.left; track seat.seatId) {
          <button
            type="button"
            (click)="toggleSeat(seat)"
            [disabled]="
              !seat.isAvailable ||
              (!isSelected(seat.seatId) && selectedSeatIds().length >= maxSeats())
            "
            [class]="getSeatButtonClass(seat)"
            class="relative flex items-center h-12 rounded-lg border p-1.5 transition-all text-left focus:outline-none focus:ring-2 focus:ring-sky-500"
          >
            <div
              [class]="getBadgeClass(seat)"
              class="w-7 sm:w-8 h-full rounded-md flex items-center justify-center font-bold text-xs uppercase flex-shrink-0"
            >
              {{ getLocationBadge(seat.location) }}
            </div>

            <div class="ml-2 sm:ml-3 flex flex-col justify-center min-w-0 overflow-hidden">
              <span
                [class]="getTextColorClass(seat, false)"
                class="text-xs sm:text-sm font-bold leading-tight truncate"
              >
                {{ seat.seatNumber }}
              </span>
              <span
                [class]="getTextColorClass(seat, true)"
                class="text-[10px] font-medium leading-tight truncate"
              >
                {{
                  isSelected(seat.seatId) ? 'Selected' : seat.isAvailable ? seat.location : 'Booked'
                }}
              </span>
            </div>
          </button>
        }

        <!-- Center Aisle Spacer -->
        <div
          class="flex items-center justify-center text-[10px] font-bold uppercase text-gray-300 tracking-wider select-none"
        >
          Aisle
        </div>

        <!-- Right Side Seats (3 Seats) -->
        @for (seat of row.right; track seat.seatId) {
          <button
            type="button"
            (click)="toggleSeat(seat)"
            [disabled]="
              !seat.isAvailable ||
              (!isSelected(seat.seatId) && selectedSeatIds().length >= maxSeats())
            "
            [class]="getSeatButtonClass(seat)"
            class="relative flex items-center h-12 rounded-lg border p-1.5 transition-all text-left focus:outline-none focus:ring-2 focus:ring-sky-500"
          >
            <div
              [class]="getBadgeClass(seat)"
              class="w-7 sm:w-8 h-full rounded-md flex items-center justify-center font-bold text-xs uppercase flex-shrink-0"
            >
              {{ getLocationBadge(seat.location) }}
            </div>

            <div class="ml-2 sm:ml-3 flex flex-col justify-center min-w-0 overflow-hidden">
              <span
                [class]="getTextColorClass(seat, false)"
                class="text-xs sm:text-sm font-bold leading-tight truncate"
              >
                {{ seat.seatNumber }}
              </span>
              <span
                [class]="getTextColorClass(seat, true)"
                class="text-[10px] font-medium leading-tight truncate"
              >
                {{
                  isSelected(seat.seatId) ? 'Selected' : seat.isAvailable ? seat.location : 'Booked'
                }}
              </span>
            </div>
          </button>
        }
      </div>
    }
  </div>
</div>
