<nav
  class="fixed top-0 left-0 w-full z-50 transition-transform duration-300"
  [class.-translate-y-full]="isHidden()"
>
  <div
    class="max-w-7xl mx-auto w-[95%] sm:w-[90%] lg:w-[70%] h-14 sm:h-16 flex justify-between items-center px-3 sm:px-4 bg-black/40 my-1 rounded-xl backdrop-blur-md"
  >
    <!-- Logo Section -->
    <a routerLink="/">
      <div class="h-9 sm:h-12 flex items-center">
        <img
          ngSrc="/assets/logo.png"
          alt="Company Logo"
          class="object-contain h-full w-auto"
          priority
          width="1406"
          height="440"
        />
      </div>
    </a>

    <!-- Desktop Navigation Actions -->
    @defer (on idle) { @if (!isMobileMenuOpen()) {
    <app-desktop-nav-actions
      [isLoggedIn]="isLoggedIn()"
      [isAdmin]="isAdmin()"
      [(showLoginModel)]="showLoginModel"
    />
    } } @placeholder {
    <!-- Move display visibility (hidden on mobile, flex on sm+) to the wrapper -->
    <div class="hidden sm:flex items-center gap-4">
      <div class="space-y-2">
        <!-- Fixed h-4 height added; valid w-44 & w-56 widths used -->
        <hlm-skeleton class="h-4 w-40 sm:w-44 md:w-64 lg:w-90" />
        <hlm-skeleton class="h-4 w-32 sm:w-40 md:w-56 lg:w-80" />
      </div>

      <!-- Avatar Skeleton -->
      <hlm-skeleton class="size-9 rounded-full md:size-10 shrink-0" />
    </div>
    }

    <!-- Mobile Controls -->
    <div class="flex items-center gap-2 md:hidden">
      @defer (when isLoggedIn()) { @if (isLoggedIn()) {
      <spartan-avatar />
      } }

      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="p-1.5 text-white hover:text-gray-300 focus:outline-none cursor-pointer"
        aria-label="Toggle navigation menu"
      >
        <ng-icon
          [name]="isMobileMenuOpen() ? 'lucideX' : 'lucideMenu'"
          size="24"
        />
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  @defer (when isMobileMenuOpen()) { @if(isMobileMenuOpen()){
  <app-mobile-nav-actions
    [(showLoginModel)]="showLoginModel"
    [isMobileMenuOpen]="isMobileMenuOpen()"
    (isMobileMenuOpenChange)="isMobileMenuOpen.set($event)"
    [isLoggedIn]="isLoggedIn()"
    [isAdmin]="isAdmin()"
  />
  } }
</nav>
