<div class="grid gap-5 lg:grid-cols-2">
  <article class="rounded-xl border border-slate-200 bg-white p-4">
    <h3 class="mb-3 font-bold text-slate-800">Ticket sales and cancellations</h3>
    <div class="relative h-64"><canvas #salesCanvas aria-label="Ticket sales trend chart"></canvas></div>
  </article>
  <article class="rounded-xl border border-slate-200 bg-white p-4">
    <h3 class="mb-3 font-bold text-slate-800">Revenue by month</h3>
    <div class="relative h-64"><canvas #revenueCanvas aria-label="Monthly revenue chart"></canvas></div>
  </article>
  <article class="rounded-xl border border-slate-200 bg-white p-4">
    <h3 class="mb-3 font-bold text-slate-800">Flight status distribution</h3>
    <div class="relative h-64"><canvas #statusCanvas aria-label="Flight status distribution chart"></canvas></div>
  </article>
  <article class="rounded-xl border border-slate-200 bg-white p-4">
    <h3 class="mb-3 font-bold text-slate-800">Top five routes</h3>
    <div class="relative h-64"><canvas #routesCanvas aria-label="Top routes by tickets booked chart"></canvas></div>
  </article>
</div>
